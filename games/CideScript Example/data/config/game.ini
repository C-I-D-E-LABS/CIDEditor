[Common] # This section applies the 'MOD_' prefix to the flags so you don't have to.
NAME="CideScript Platformer"
DESCRIPTION="A tiny platformer written entirely in CideScript (.cide) - no images, no tilemaps, just code. data/states/Menu.cide is the title menu, data/states/Platformer.cide is the level."
AUTHOR=""
VERSION="1.0"

# DO NOT EDIT!! this is used to check for version compatibility!
API_VERSION=3

[StateRedirects] # The engine starts every game at TitleState - send it to our own menu instead.
# "Menu" = data/states/Menu.cide (or .hx - the engine tries every script extension), run through ModState.
# MainMenuState too, so nothing wanders into the engine's FNF menus (this game has none of their assets).
TitleState="Menu"
MainMenuState="Menu"
