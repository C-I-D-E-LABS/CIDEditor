[Common] # This section applies the 'MOD_' prefix to the flags so you don't have to.
NAME="Friday Night Funkin'"
DESCRIPTION="The base Friday Night Funkin' game (Week 1 and the default characters, menus and stages)."
AUTHOR="The Funkin' Crew Inc."
VERSION="1.0"

# DO NOT EDIT!! this is used to check for version compatibility!
API_VERSION=3

[StateRedirects] # Routes engine states to this game's own hscript versions instead of the
# compiled funkin.menus.* classes - see data/states/*.hx. A value that isn't a resolvable
# class name (like these) is treated as a script name and loaded through ModState.
MainMenuState="MainMenuState"
TitleState="TitleState"
StoryMenuState="StoryMenuState"
FreeplayState="FreeplayState"

[Flags] # Sets this game's default pause menu to its own script (data/scripts/default-pause.hx).
DEFAULT_PAUSE_SCRIPT="data/scripts/default-pause"
DEFAULT_GAMEOVER_SCRIPT="data/scripts/default-gameover"
