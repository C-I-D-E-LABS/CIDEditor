[Common] # This section applies the 'MOD_' prefix to the flags so you don't have to.
NAME="Tilemap Test"
DESCRIPTION="A small platformer level for testing the tilemap editor, per-pixel tile collision, and entities (a Player made from the Platformer Player template, plus Coins)."
AUTHOR=""
VERSION="1.0"

# DO NOT EDIT!! this is used to check for version compatibility!
API_VERSION=3

[StateRedirects] # The engine starts every game at TitleState - send it straight to the level
# instead (data/states/Level.hx, loaded through ModState since it isn't a compiled class).
# MainMenuState too, so nothing can wander into the engine's FNF menus (this game has none of
# their assets).
TitleState="Level"
MainMenuState="Level"

[Flags] # Pixel-art game: tilemaps + sprite-editor sprites draw crisp (no smoothing), cameras snap to whole pixels.
PIXEL_ART=true

